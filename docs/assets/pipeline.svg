<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 336" width="1200" height="336" role="img" aria-labelledby="title desc">
  <title id="title">How a diagnosis works</title>
  <desc id="desc">A photo is checked for type, size and rate limits, classified by MobileNetV2, then either returned as a diagnosis when confidence is at least 75 percent, sent to Gemini for a second opinion, or the farmer is asked to retake the photo.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2e22"/>
      <stop offset="1" stop-color="#0f3d2c"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14532d"/>
      <stop offset="1" stop-color="#0f3f23"/>
    </linearGradient>
    <style>
      .h { font: 700 17px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #f0fdf4; }
      .s { font: 500 13px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #a7f3d0; }
      .t { font: 700 12px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: 1.5px; fill: #86efac; }
      .wire { fill: none; stroke: #2f855a; stroke-width: 2.5; stroke-dasharray: 6 7; animation: flow 1.2s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -26; } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes pulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <rect width="1200" height="336" rx="20" fill="url(#bg)"/>
  <text x="40" y="44" class="t">HOW A DIAGNOSIS WORKS</text>

  <!-- wires -->
  <path id="w1" class="wire" d="M200 130 H 250"/>
  <path id="w2" class="wire" d="M430 130 H 480"/>
  <path id="w3" class="wire" d="M660 130 H 710"/>
  <path id="wOk" class="wire" d="M890 110 C 930 110 930 92 970 92"/>
  <path id="wLow" class="wire" d="M800 175 V 225 H 860"/>
  <path id="wG" class="wire" d="M1040 225 H 1070 V 124"/>

  <!-- nodes -->
  <g>
    <rect x="40" y="88" width="160" height="84" rx="16" fill="url(#node)" stroke="#22c55e" stroke-opacity=".5"/>
    <circle cx="72" cy="130" r="16" fill="#22c55e" class="pulse"/>
    <rect x="63" y="123" width="18" height="13" rx="3" fill="#0b2e22"/><circle cx="72" cy="129.5" r="3.5" fill="#22c55e"/>
    <text x="98" y="125" class="h">Photo</text>
    <text x="98" y="145" class="s">camera / gallery</text>
  </g>
  <g>
    <rect x="250" y="88" width="180" height="84" rx="16" fill="url(#node)" stroke="#22c55e" stroke-opacity=".5"/>
    <path d="M282 112 l16 6 v12 c0 9 -7 15 -16 18 c-9 -3 -16 -9 -16 -18 v-12 z" fill="#facc15" class="pulse"/>
    <text x="308" y="125" class="h">Checks</text>
    <text x="308" y="145" class="s">type · 5 MB · rate</text>
  </g>
  <g>
    <rect x="480" y="88" width="180" height="84" rx="16" fill="url(#node)" stroke="#22c55e" stroke-opacity=".5"/>
    <g fill="none" stroke="#38bdf8" stroke-width="2.5" class="pulse"><circle cx="512" cy="130" r="14"/><path d="M503 130 h18 M512 121 v18"/></g>
    <text x="538" y="125" class="h">MobileNetV2</text>
    <text x="538" y="145" class="s">38 classes · 14 crops</text>
  </g>
  <g>
    <rect x="710" y="88" width="180" height="84" rx="16" fill="url(#node)" stroke="#22c55e" stroke-opacity=".5"/>
    <path d="M742 116 l14 14 l-14 14 l-14 -14 z" fill="#f97316" class="pulse"/>
    <text x="768" y="125" class="h">Confident?</text>
    <text x="768" y="145" class="s">score ≥ 75%</text>
  </g>

  <!-- outcomes -->
  <g>
    <rect x="970" y="60" width="190" height="64" rx="16" fill="#166534" stroke="#4ade80"/>
    <path d="M992 92 l8 8 l16 -16" stroke="#bbf7d0" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1026" y="88" class="h">Diagnosis</text>
    <text x="1026" y="108" class="s">+ treatment plan</text>
  </g>
  <text x="900" y="84" class="s" style="fill:#4ade80">yes</text>

  <g>
    <rect x="860" y="195" width="180" height="60" rx="16" fill="#3b2a6b" stroke="#a78bfa"/>
    <path d="M884 213 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3 z" fill="#ddd6fe" class="pulse"/>
    <text x="904" y="222" class="h">Gemini</text>
    <text x="904" y="241" class="s" style="fill:#ddd6fe">second opinion</text>
  </g>
  <text x="808" y="206" class="s" style="fill:#fdba74">no</text>

  <g>
    <rect x="970" y="266" width="190" height="50" rx="14" fill="#422006" stroke="#f59e0b"/>
    <text x="992" y="290" class="h" style="font-size:15px">Retake photo</text>
    <text x="992" y="307" class="s" style="fill:#fde68a">not a plant / unsure</text>
  </g>
  <path class="wire" d="M1000 255 V 266" style="stroke:#b45309"/>
  <text x="1078" y="180" class="s" style="fill:#c4b5fd">plant</text>

  <!-- data packets -->
  <g fill="#bef264">
    <circle r="5"><animateMotion dur="1s" repeatCount="indefinite"><mpath href="#w1"/></animateMotion></circle>
    <circle r="5"><animateMotion dur="1s" begin=".33s" repeatCount="indefinite"><mpath href="#w2"/></animateMotion></circle>
    <circle r="5"><animateMotion dur="1s" begin=".66s" repeatCount="indefinite"><mpath href="#w3"/></animateMotion></circle>
    <circle r="5"><animateMotion dur="1.2s" begin=".2s" repeatCount="indefinite"><mpath href="#wOk"/></animateMotion></circle>
  </g>
  <g fill="#c4b5fd">
    <circle r="4.5"><animateMotion dur="1.6s" begin=".8s" repeatCount="indefinite"><mpath href="#wLow"/></animateMotion></circle>
    <circle r="4.5"><animateMotion dur="1.4s" begin="1.1s" repeatCount="indefinite"><mpath href="#wG"/></animateMotion></circle>
  </g>
</svg>
